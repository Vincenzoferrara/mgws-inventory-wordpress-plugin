name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the floor declared in the plugin header and readme.txt. Linting
        # the lower bound is what stops a 8.1-only construct from reaching a
        # store that installed the plugin on the version it asked for.
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntax check the shipped files
        run: |
          lint_status=0
          while IFS= read -r file; do
            php -l "$file" || lint_status=1
          done < <(git ls-files '*.php' | grep -v '^tests/')
          exit $lint_status

      - name: No closing PHP tag
        run: |
          if git ls-files '*.php' | grep -v '^tests/' | xargs grep -n '?>'; then
            echo "a closing PHP tag lets stray whitespace reach the response body"
            exit 1
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # A .pot left stale by a new gettext call ships a string that no
      # translator will ever see, and the omission is invisible. The build
      # depends on this job, so a release cannot go out with a stale catalogue.
      - name: Translation template is current
        run: php bin/make-pot.php --check

  build:
    name: Release archive
    runs-on: ubuntu-latest
    needs: [lint, checks]
    steps:
      - uses: actions/checkout@v4

      - name: Build the installable zip
        run: bash bin/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mg-warehouse-stock
          path: dist/*.zip
          if-no-files-found: error
